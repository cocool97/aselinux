<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>segui</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Shield: SELinux policy -->
  <path d="M128 30 L198 56 V118 C198 166 168 200 128 218 C88 200 58 166 58 118 V56 Z"
        fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-width="10" stroke-linejoin="round"/>

  <!-- Graph: domains and types linked by rules -->
  <g stroke="#3ddc84" stroke-width="6" stroke-linecap="round">
    <line x1="98" y1="88" x2="140" y2="104"/>
    <line x1="98" y1="88" x2="104" y2="140"/>
    <line x1="140" y1="104" x2="104" y2="140"/>
  </g>
  <g fill="#3ddc84">
    <circle cx="98" cy="88" r="11"/>
    <circle cx="104" cy="140" r="11"/>
  </g>

  <!-- Magnifier: exploring the policy -->
  <circle cx="150" cy="124" r="30" fill="#0f172a" stroke="#f8fafc" stroke-width="10"/>
  <circle cx="150" cy="124" r="10" fill="#3ddc84"/>
  <line x1="172" y1="146" x2="206" y2="180" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
</svg>
